<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор доставки роллов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>🍣 Калькулятор доставки роллов</h1>
    <p>Узнайте стоимость доставки вашего любимого сета за пару секунд</p>
  </header>

  <main class="container">
    <!-- Форма калькулятора -->
    <section class="card" aria-label="Форма расчёта">
      <form id="calc-form" novalidate>
        <div class="field">
          <label for="distance">Расстояние доставки, км</label>
          <input type="text" id="distance" name="distance"
                 placeholder="Например: 5" autocomplete="off">
          <span class="error-msg" id="error-distance" role="alert"></span>
        </div>

        <div class="field">
          <label for="portions">Количество порций</label>
          <input type="text" id="portions" name="portions"
                 placeholder="Например: 3" autocomplete="off">
          <span class="error-msg" id="error-portions" role="alert"></span>
        </div>

        <div class="field">
          <label for="roll-type">Тип роллов</label>
          <select id="roll-type" name="roll-type">
            <option value="1" selected>Обычные</option>
            <option value="1.3">Острые</option>
            <option value="1.6">Премиум</option>
          </select>
        </div>

        <div class="buttons">
          <button type="submit" class="btn btn-primary">Рассчитать стоимость</button>
          <button type="reset" class="btn btn-ghost">Сбросить</button>
        </div>
      </form>

      <!-- Блок результата -->
      <div id="result" class="result" hidden>
        <h2>Итоговая стоимость доставки</h2>
        <p id="result-text"></p>
      </div>
    </section>

    <!-- Журнал запросов -->
    <section class="card" aria-label="Журнал запросов">
      <div class="journal-head">
        <h2>Журнал заказов</h2>
        <button type="button" id="clear-log" class="btn btn-danger">
          Очистить журнал
        </button>
      </div>

      <ul id="log-list" class="log-list"></ul>
      <p id="log-empty" class="log-empty">Пока нет заказов — сделайте первый расчёт!</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Учебный проект-калькулятор &middot; <a href="index.html">На главную</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
